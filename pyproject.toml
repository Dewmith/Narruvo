[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "narruvo"
version = "0.2.1"
description = "An offline PDF audiobook reader for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6==6.10.3",
  "PyMuPDF==1.26.7",
  "kokoro-onnx==0.6.1",
  "soundfile==0.13.1",
  "numpy==2.5.5",
  "onnxruntime==1.32.0",
  "phonemizer==3.6.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-qt==4.5.0"]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.10"]

[project.scripts]
narruvo = "narruvo.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/narruvo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-m 'not integration'"
markers = ["integration: requires installed Kokoro model files or actual Qt multimedia"]

