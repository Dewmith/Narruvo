name: Publish Windows release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag, e.g. v0.1.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate target release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - name: Require an existing mutable, published release
        id: target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '\Av[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*\z') {
            throw 'Use an existing release tag such as v0.1.0, matching the project version.'
          }
          $endpoint = "repos/$env:GH_REPO/releases/tags/$([uri]::EscapeDataString($env:RELEASE_TAG))"
          $json = gh api --method GET $endpoint
          if ($LASTEXITCODE -ne 0) { throw 'The release does not exist or is inaccessible.' }
          $release = $json | ConvertFrom-Json
          if ($release.draft) { throw 'Publish the release before running this workflow.' }
          if ($release.immutable) { throw 'Immutable releases cannot accept assets after publication. Disable immutability for this release flow.' }
          "tag=$env:RELEASE_TAG" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

  build:
    needs: release
    uses: ./.github/workflows/windows-build.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}

  publish:
    name: Attach installer and checksum
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: release-assets
      - name: Verify checksum and upload only the generated assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          $name = "Narruvo-$($env:RELEASE_TAG.Substring(1))-windows-x64-setup.exe"
          $installer = Join-Path (Resolve-Path release-assets).Path $name
          $checksum = "$installer.sha256"
          $files = @(Get-ChildItem -LiteralPath release-assets -File -Recurse)
          if ($files.Count -ne 2 -or -not (Test-Path -LiteralPath $installer) -or -not (Test-Path -LiteralPath $checksum)) {
            throw 'Expected exactly the versioned installer and its checksum.'
          }
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "$actualHash  $name"
          if ([IO.File]::ReadAllText($checksum).TrimEnd("`r", "`n") -cne $expected) { throw 'Installer checksum does not match.' }
          $endpoint = "repos/$env:GH_REPO/releases/tags/$([uri]::EscapeDataString($env:RELEASE_TAG))"
          $json = gh api --method GET $endpoint
          if ($LASTEXITCODE -ne 0) { throw 'Target release is unavailable.' }
          $release = $json | ConvertFrom-Json
          if ($release.draft -or $release.immutable) { throw 'The release must still be published and mutable.' }
          gh release upload $env:RELEASE_TAG $installer $checksum --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed; rerun the failed publishing job.' }
