name: Build and verify Windows installer

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing release tag to check out and use as the package version; empty for CI
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      NARRUVO_TEST_MODELS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set package version from release tag
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/package_metadata.py --release-tag $env:RELEASE_TAG --sync-version
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -e '.[dev,build]'
      - name: Check dependencies and run ordinary tests
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pytest --junitxml=.artifacts/test-results.xml
      - name: Build, install, and verify
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: .\scripts\build.ps1 -ReleaseTag $env:RELEASE_TAG
      - name: Retain verified release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: |
            dist/release/Narruvo-*-windows-x64-setup.exe
            dist/release/Narruvo-*-windows-x64-setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain test and package diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-diagnostics
          path: |
            .artifacts/test-results.xml
            .artifacts/package-verification/**/*.log
            build/pyinstaller/narruvo/warn-narruvo.txt
          if-no-files-found: ignore
          retention-days: 7
